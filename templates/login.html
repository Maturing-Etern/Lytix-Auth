{% extends "base.html" %}
{% block title %}登录 - Lytix Auth{% endblock %}

{% block content %}
<div class="container">
  <div class="card">
    <h2 class="card-title">登录</h2>
    <p class="card-subtitle">输入用户名和密码继续</p>

    {% if need_verify %}
    <div class="alert alert-warning">
      邮箱 <strong>{{ verify_email }}</strong> 尚未验证。
      <a href="{{ url_for('resend_verification') }}" style="border-bottom:1px solid currentColor">重新发送验证邮件</a>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" class="form-input"
               placeholder="输入用户名" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" class="form-input"
               placeholder="输入密码" required autocomplete="current-password">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn">登录</button>
      </div>
    </form>

    <div class="auth-link">
      没有账号？<a href="{{ url_for('register') }}">注册</a>
    </div>
  </div>
</div>
{% endblock %}
