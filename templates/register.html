{% extends "base.html" %}
{% block title %}注册 - Lytix Auth{% endblock %}

{% block content %}
<div class="container">
  <div class="card">
    <h2 class="card-title">注册</h2>
    <p class="card-subtitle">创建新账号以使用系统</p>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" class="form-input"
               placeholder="至少 3 个字符" required minlength="3" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" id="email" name="email" class="form-input"
               placeholder="your@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" class="form-input"
               placeholder="至少 6 个字符" required minlength="6" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="confirm">确认密码</label>
        <input type="password" id="confirm" name="confirm" class="form-input"
               placeholder="再次输入密码" required minlength="6" autocomplete="new-password">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn">注册</button>
      </div>
    </form>

    <div class="auth-link">
      已有账号？<a href="{{ url_for('login') }}">登录</a>
    </div>
  </div>
</div>
{% endblock %}
